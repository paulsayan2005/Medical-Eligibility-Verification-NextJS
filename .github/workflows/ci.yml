name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js 22.x
      uses: actions/setup-node@v3
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install Midnight Compact Compiler
      run: |
        curl -L "https://github.com/midnightntwrk/compact/releases/download/compactc-v0.31.1/compactc_v0.31.1_x86_64-unknown-linux-musl.zip" -o compactc.zip
        unzip -o compactc.zip -d compact-tools
        mkdir -p ~/.compact/versions/0.31.1/x86_64-unknown-linux-musl
        mv compact-tools/* ~/.compact/versions/0.31.1/x86_64-unknown-linux-musl/
        chmod +x ~/.compact/versions/0.31.1/x86_64-unknown-linux-musl/*
        echo "$HOME/.compact/versions/0.31.1/x86_64-unknown-linux-musl" >> $GITHUB_PATH

    - name: Install dependencies
      run: npm ci

    - name: Compile Contract
      run: npm run compile

    - name: Test Contract CLI (Vitest)
      run: npm run test

    - name: Build Next.js Frontend
      run: npm run build
